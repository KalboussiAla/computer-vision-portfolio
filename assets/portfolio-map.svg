<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-label="Portfolio map for computer vision and applied AI projects">
  <defs>
    <style>
      .bg{fill:#f7f9fb}
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#17212b}
      .subtitle{font:400 15px Arial,Helvetica,sans-serif;fill:#5b6674}
      .hub{fill:#0a5f78}
      .hubtext{font:700 20px Arial,Helvetica,sans-serif;fill:white}
      .node{fill:white;stroke:#cfd9e2;stroke-width:2}
      .nodeTitle{font:700 16px Arial,Helvetica,sans-serif;fill:#17212b}
      .nodeText{font:400 12px Arial,Helvetica,sans-serif;fill:#5b6674}
      .line{stroke:#8bb5c3;stroke-width:3;stroke-linecap:round}
      .accent{fill:#0a5f78}
      .warm{fill:#8a5a28}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="560" rx="18"/>
  <text class="title" x="50" y="58">Computer Vision &amp; Applied AI Portfolio</text>
  <text class="subtitle" x="50" y="84">Industrial vision, fine-grained recognition, dataset engineering, anomaly detection, video analytics, and AI deployment.</text>
  <circle class="hub" cx="560" cy="285" r="88"/>
  <text class="hubtext" x="505" y="275">Industrial</text>
  <text class="hubtext" x="500" y="300">Visual AI</text>
  <line class="line" x1="505" y1="220" x2="255" y2="145"/>
  <line class="line" x1="560" y1="197" x2="560" y2="138"/>
  <line class="line" x1="625" y1="225" x2="855" y2="145"/>
  <line class="line" x1="472" y1="295" x2="260" y2="295"/>
  <line class="line" x1="648" y1="295" x2="860" y2="295"/>
  <line class="line" x1="512" y1="348" x2="300" y2="430"/>
  <line class="line" x1="608" y1="348" x2="820" y2="430"/>

  <rect class="node" x="65" y="105" width="260" height="86" rx="10"/>
  <circle class="accent" cx="95" cy="134" r="10"/>
  <text class="nodeTitle" x="116" y="135">Detection &amp; Counting</text>
  <text class="nodeText" x="86" y="160">Pipe counting, cartons, virtual lines,</text>
  <text class="nodeText" x="86" y="178">YOLO, MAE, precision, recall.</text>

  <rect class="node" x="430" y="95" width="260" height="86" rx="10"/>
  <circle class="warm" cx="460" cy="124" r="10"/>
  <text class="nodeTitle" x="481" y="125">Fine-Grained Recognition</text>
  <text class="nodeText" x="451" y="150">Retail products, DINO, FAISS,</text>
  <text class="nodeText" x="451" y="168">adapters, top-k evaluation.</text>

  <rect class="node" x="795" y="105" width="260" height="86" rx="10"/>
  <circle class="accent" cx="825" cy="134" r="10"/>
  <text class="nodeTitle" x="846" y="135">Dataset Engineering</text>
  <text class="nodeText" x="816" y="160">Hydra, semi-annotation, labels,</text>
  <text class="nodeText" x="816" y="178">YOLO/COCO workflows.</text>

  <rect class="node" x="65" y="252" width="260" height="86" rx="10"/>
  <circle class="warm" cx="95" cy="281" r="10"/>
  <text class="nodeTitle" x="116" y="282">Video Analytics</text>
  <text class="nodeText" x="86" y="307">Long videos, FFmpeg, tracking,</text>
  <text class="nodeText" x="86" y="325">reports, corrupted frames.</text>

  <rect class="node" x="795" y="252" width="260" height="86" rx="10"/>
  <circle class="accent" cx="825" cy="281" r="10"/>
  <text class="nodeTitle" x="846" y="282">Visual Inspection</text>
  <text class="nodeText" x="816" y="307">PCB AOI, SSIM, OpenCV, defects,</text>
  <text class="nodeText" x="816" y="325">reference-vs-test comparison.</text>

  <rect class="node" x="115" y="397" width="300" height="92" rx="10"/>
  <circle class="accent" cx="145" cy="426" r="10"/>
  <text class="nodeTitle" x="166" y="427">AI Deployment</text>
  <text class="nodeText" x="136" y="452">FastAPI, GPU inference, batch APIs,</text>
  <text class="nodeText" x="136" y="470">JSON, ZIP outputs, frontend tests.</text>

  <rect class="node" x="705" y="397" width="300" height="92" rx="10"/>
  <circle class="warm" cx="735" cy="426" r="10"/>
  <text class="nodeTitle" x="756" y="427">Research Concepts</text>
  <text class="nodeText" x="726" y="452">SAM, few-shot counting, clustering,</text>
  <text class="nodeText" x="726" y="470">SSRI, AI agents, Planum.AI.</text>
</svg>

